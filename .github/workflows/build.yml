# ================================================================
# Build FFmpeg + JNI — 4 platforms × 3 Java versions (17 / 21 / 25)
#
# Each platform builds FFmpeg shared libs once, then compiles the
# JNI wrapper separately against JDK 17 / 21 / 25.
#
# Platforms:
#   windows-x64   MSYS2 + MinGW-w64 via pwsh calling MSYS2 bash (build-minimal.sh)
#   macos-arm64   Apple clang + SecureTransport (build-minimal.sh)
#   linux-x64     gcc + OpenSSL           (build-minimal.sh)
#   android-arm64 NDK cross-compile       (build-minimal.sh)
# ================================================================

name: Build FFmpeg + JNI

on:
  push:
    branches: [master, 'release/*', 'feat/*', 'feature/*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------
jobs:
  # ---- Step 1: quick static checks ----
  check:
    name: Code check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile-check Java class
        run: javac -Xlint:all -d /tmp/jni-check jni/ApricityMediaNative.java

      - name: Check source files exist
        run: |
          for f in jni/jni_ffmpeg.c jni/ApricityMediaNative.java build-minimal.ps1 build-minimal.sh; do
            test -f "$f" && echo "  OK  $f" || { echo "  MISSING  $f"; exit 1; }
          done

      - name: Shell syntax check
        run: 'bash -n build-minimal.sh && echo "build-minimal.sh: syntax OK"'

  # ---- Step 2: build matrix ----
  build:
    name: ${{ matrix.platform }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            jni_ext: dll
            jni_lib: apricitymedia-jni

          - platform: macos-arm64
            os: macos-14
            jni_ext: dylib
            jni_lib: libapricitymedia-jni

          - platform: linux-x64
            os: ubuntu-latest
            jni_ext: so
            jni_lib: libapricitymedia-jni

          - platform: android-arm64
            os: ubuntu-latest
            jni_ext: so
            jni_lib: libapricitymedia-jni

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ===============================================================
      #  Platform dependencies
      # ===============================================================

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            diffutils

      - name: Install macOS build deps
        if: matrix.platform == 'macos-arm64'
        run: brew install make pkg-config

      - name: Install Linux build deps
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc make pkg-config libssl-dev zlib1g-dev nasm diffutils

      - name: Install Android NDK
        if: matrix.platform == 'android-arm64'
        run: |
          NDK_VERSION=r27
          echo "Downloading Android NDK ${NDK_VERSION}..."
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=${PWD}/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Android host deps
        if: matrix.platform == 'android-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make pkg-config diffutils nasm

      # ===============================================================
      #  Build FFmpeg shared libs + JNI (Java 21 — primary LTS)
      # ===============================================================

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build FFmpeg + JNI (Windows, Java 21)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'MINGW64'
          $env:CHERE_INVOKING = '1'
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash --login -c "cd '${{ github.workspace }}' && ./build-minimal.sh all"
          Move-Item -Path "build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }}" `
                    -NewName "${{ matrix.jni_lib }}-java21.${{ matrix.jni_ext }}"

      - name: Build FFmpeg + JNI (POSIX, Java 21)
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          chmod +x build-minimal.sh
          ./build-minimal.sh all
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java21.${{ matrix.jni_ext }}

      # ===============================================================
      #  JNI (Java 17 — older LTS)
      # ===============================================================

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JNI (Windows, Java 17)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $env:MSYSTEM = 'MINGW64'
          $env:CHERE_INVOKING = '1'
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash --login -c "cd '${{ github.workspace }}' && ./build-minimal.sh build-jni"
          Move-Item -Path "build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }}" `
                    -NewName "${{ matrix.jni_lib }}-java17.${{ matrix.jni_ext }}"

      - name: Build JNI (POSIX, Java 17)
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          ./build-minimal.sh build-jni
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java17.${{ matrix.jni_ext }}

      # ===============================================================
      #  JNI (Java 25 — latest)
      #  Java 25 must be available as temurin or oracle-ea;
      #  if not available the build step is skipped, existing
      #  (Java 17 + 21) artifacts are still uploaded.
      # ===============================================================

      - id: java25
        name: Setup Java 25
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          # Try temurin first; oracle-ea fallback for bleeding edge
          distribution: temurin
          java-version: '25'

      - name: Build JNI (Windows, Java 25)
        if: steps.java25.outcome == 'success' && matrix.platform == 'windows-x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MSYSTEM = 'MINGW64'
          $env:CHERE_INVOKING = '1'
          $bash = "C:\msys64\usr\bin\bash.exe"
          & $bash --login -c "cd '${{ github.workspace }}' && ./build-minimal.sh build-jni"
          Move-Item -Path "build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }}" `
                    -NewName "${{ matrix.jni_lib }}-java25.${{ matrix.jni_ext }}"

      - name: Build JNI (POSIX, Java 25)
        if: steps.java25.outcome == 'success' && matrix.platform != 'windows-x64'
        continue-on-error: true
        shell: bash
        run: |
          ./build-minimal.sh build-jni
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java25.${{ matrix.jni_ext }}

      # ===============================================================
      #  Upload artifacts (run even if Java 25 steps were skipped)
      # ===============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-jni-${{ matrix.platform }}
          path: |
            build-minimal/dist/include/
            build-minimal/dist/lib/
            build-minimal/dist/bin/
          if-no-files-found: error
          compression-level: 6
