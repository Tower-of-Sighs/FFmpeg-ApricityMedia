# ================================================================
# Build FFmpeg runtime - 4 platforms x 3 MC targets
#
# Each platform builds FFmpeg shared libs once, then compiles the JNI wrapper
# separately against JDK 17 / 21. Java 25 (MC 26.1) uses the FFM API and ships
# only the FFmpeg shared libs (no JNI wrapper).
#
# Platforms:
#   windows-x64   MSYS2 + MinGW-w64 (msys2 shell)       (build-minimal.sh)
#   macos-arm64   Apple clang + SecureTransport (build-minimal.sh)
#   linux-x64     gcc + OpenSSL           (build-minimal.sh)
#   android-arm64 NDK cross-compile       (build-minimal.sh)
# ================================================================

name: Build FFmpeg runtime

on:
  push:
    branches: [master, 'release/*', 'feat/*', 'feature/*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------
jobs:
  # ---- Step 1: quick static checks ----
  check:
    name: Code check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compile-check Java class
        run: javac -Xlint:all -d /tmp/jni-check jni/ApricityMediaNative.java

      - name: Check source files exist
        run: |
          for f in jni/jni_ffmpeg.c jni/ApricityMediaNative.java build-minimal.ps1 build-minimal.sh package-dist.ps1; do
            test -f "$f" && echo "  OK  $f" || { echo "  MISSING  $f"; exit 1; }
          done

      - name: Shell syntax check
        run: 'bash -n build-minimal.sh && echo "build-minimal.sh: syntax OK"'

  # ---- Step 2: build matrix ----
  build:
    name: ${{ matrix.platform }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            jni_ext: dll
            jni_lib: apricitymedia-jni

          - platform: macos-arm64
            os: macos-14
            jni_ext: dylib
            jni_lib: libapricitymedia-jni

          - platform: linux-x64
            os: ubuntu-latest
            jni_ext: so
            jni_lib: libapricitymedia-jni

          - platform: android-arm64
            os: ubuntu-latest
            jni_ext: so
            jni_lib: libapricitymedia-jni

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ===============================================================
      #  Platform dependencies
      # ===============================================================

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-crt-git
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-dav1d
            diffutils

      - name: Install macOS build deps
        if: matrix.platform == 'macos-arm64'
        run: brew install make pkg-config

      - name: Install Linux build deps
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc make pkg-config libssl-dev zlib1g-dev nasm diffutils

      - name: Install Android NDK
        if: matrix.platform == 'android-arm64'
        run: |
          NDK_VERSION=r27
          echo "Downloading Android NDK ${NDK_VERSION}..."
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=${PWD}/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Android host deps
        if: matrix.platform == 'android-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make pkg-config diffutils nasm

      # ===============================================================
      #  Build FFmpeg shared libs + JNI (Java 21 - primary LTS)
      # ===============================================================

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify dav1d in MSYS2 (Windows)
        if: matrix.platform == 'windows-x64'
        shell: msys2 {0}
        run: |
          pacman -Q mingw-w64-x86_64-dav1d
          pkg-config --modversion dav1d
      - name: Build FFmpeg + JNI (Windows, Java 21)
        if: matrix.platform == 'windows-x64'
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash build-minimal.sh all
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java21.${{ matrix.jni_ext }}

      - name: Build FFmpeg + JNI (POSIX, Java 21)
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          chmod +x build-minimal.sh
          ./build-minimal.sh all
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java21.${{ matrix.jni_ext }}

      # ===============================================================
      #  JNI (Java 17 - older LTS)
      # ===============================================================

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build JNI (Windows, Java 17)
        if: matrix.platform == 'windows-x64'
        shell: msys2 {0}
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash build-minimal.sh build-jni
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java17.${{ matrix.jni_ext }}

      - name: Build JNI (POSIX, Java 17)
        if: matrix.platform != 'windows-x64'
        shell: bash
        run: |
          ./build-minimal.sh build-jni
          mv build-minimal/dist/bin/${{ matrix.jni_lib }}.${{ matrix.jni_ext }} \
             build-minimal/dist/bin/${{ matrix.jni_lib }}-java17.${{ matrix.jni_ext }}

      # ===============================================================
      #  MC 26.1 (Java 25) uses FFM API
      #  No JNI wrapper is built for this target; we package FFmpeg libs only.
      # ===============================================================

      # ===============================================================
      #  Package dist-mc zips (per platform)
      # ===============================================================

      - name: Create platform artifact zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path libs | Out-Null
          Compress-Archive -Path "build-minimal/dist/*" -DestinationPath "libs/ffmpeg-jni-${{ matrix.platform }}.zip" -Force

      - name: Package MC zips
        shell: pwsh
        run: |
          ./package-dist.ps1 -ArtifactsDir libs -OutputDir dist-mc -OnlyPlatforms "${{ matrix.platform }}"

      - name: Upload dist-mc (per platform)
        uses: actions/upload-artifact@v4
        with:
          name: dist-mc-${{ matrix.platform }}
          path: dist-mc/
          if-no-files-found: error
          compression-level: 6

  # ---- Step 3: merge dist-mc across platforms ----
  dist-mc:
    name: dist-mc
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge dist-mc artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: dist-mc
          pattern: dist-mc-*
          delete-merged: true

